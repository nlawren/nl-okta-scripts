# Steps shared by the dry-run, validate and apply jobs in okta-deprovision.yml.
# Everything runs inside okta-deprovision/, which is self-contained.
parameters:
  - name: mode
    type: string
    default: dry-run
    values:
      - dry-run
      - validate
      - apply

steps:
  - bash: |
      if [ "$(Build.Reason)" != "Manual" ]; then
        echo "##vso[task.logissue type=error]okta-deprovision only runs when started manually (reason: $(Build.Reason))."
        exit 1
      fi
      echo "Manual run by $(Build.RequestedFor) on $(Build.SourceBranch) at $(Build.SourceVersion)"
    displayName: Guard - manual runs only

  - checkout: self   # deployment jobs don't check out by default, so do it here for both
    fetchDepth: 1

  - task: Cache@2
    displayName: Cache uv packages
    inputs:
      key: 'uv | "$(Agent.OS)" | okta-deprovision/uv.lock'
      path: $(Pipeline.Workspace)/.uv-cache

  - bash: |
      set -euo pipefail
      curl -LsSf "https://astral.sh/uv/0.12.18/install.sh" | sh
      echo "##vso[task.prependpath]$HOME/.local/bin"
    displayName: Install uv

  - bash: uv sync --locked --no-dev
    displayName: Install Python and dependencies
    workingDirectory: $(Build.SourcesDirectory)/okta-deprovision
    env:
      UV_CACHE_DIR: $(Pipeline.Workspace)/.uv-cache

  # validate writes users-validated.csv; dry-run and apply write output.csv
  - bash: >-
      uv run --no-sync deactivate_users.py --input users.csv
      --output ${{ iif(eq(parameters.mode, 'validate'), 'users-validated.csv', 'output.csv') }}
      ${{ iif(eq(parameters.mode, 'apply'), '--apply --backup backup.jsonl', iif(eq(parameters.mode, 'validate'), '--validate', '')) }}
    displayName: ${{ iif(eq(parameters.mode, 'apply'), 'Deactivate Okta users', iif(eq(parameters.mode, 'validate'), 'Validate - Okta status report only', 'Dry run - report only')) }}
    workingDirectory: $(Build.SourcesDirectory)/okta-deprovision
    env:
      OKTA_ORG_URL: $(OKTA_ORG_URL)
      OKTA_API_TOKEN: $(OKTA_API_TOKEN)   # secrets only reach a step when mapped here
      PYTHONUNBUFFERED: "1"

  - bash: uv cache prune --ci
    displayName: Trim uv cache
    condition: always()
    env:
      UV_CACHE_DIR: $(Pipeline.Workspace)/.uv-cache

  - publish: $(Build.SourcesDirectory)/okta-deprovision/${{ iif(eq(parameters.mode, 'validate'), 'users-validated.csv', 'output.csv') }}
    artifact: okta-deprovision-${{ iif(eq(parameters.mode, 'apply'), 'applied', parameters.mode) }}-report-$(System.JobAttempt)
    displayName: Publish report
    condition: always()

  # Apply backs each user up (Okta record, groups, app assignments) before
  # deactivating them. It holds personal data: anyone who can view this
  # pipeline's runs can download it, and it's kept per the retention policy.
  - ${{ if eq(parameters.mode, 'apply') }}:
      - publish: $(Build.SourcesDirectory)/okta-deprovision/backup.jsonl
        artifact: okta-deprovision-backup-$(System.JobAttempt)
        displayName: Publish backup
        condition: always()
